[project]
name = "handqa"
version = "0.1.0"
description = "Guided human-in-the-loop QA harness for Android devices over FIRERPA and adb"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "lamda==10.12",
    "mcp[cli]>=1.9",
    "pillow>=13.0.0",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
handqa = "handqa.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handqa"]
