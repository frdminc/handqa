name: HandQA voice regression verification

on:
  push:
    branches: [ci/voice-while-typing-20261126]

permissions:
  contents: read

jobs:
  voice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 6
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: false
      - name: Reproduce the cut on the previous runner
        run: |
          set -euo pipefail
          git restore --source 354efd8df498f60066c22762bffaf5b987cd2644 handqa/hitl_runner.py
          status=0
          uv run --locked --group dev pytest -q tests/test_speech.py -k typing_ends_reprompts_without_cutting > "$RUNNER_TEMP/before.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/before.txt"
          test "$status" -eq 1
          grep -F 'assert [1] == [0]' "$RUNNER_TEMP/before.txt"
          git restore --source HEAD handqa/hitl_runner.py
      - name: Reproduce delayed shade Stop on the first narration patch
        run: |
          set -euo pipefail
          git restore --source 484a171819af59f32ed32855a7c381abb914b6a3 handqa/hitl_runner.py
          status=0
          uv run --locked --group dev pytest -q tests/test_speech.py -k shade_stop_cuts_the_voice_after_typing > "$RUNNER_TEMP/shade-stop-before.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/shade-stop-before.txt"
          test "$status" -eq 1
          grep -F 'assert [0] == [1]' "$RUNNER_TEMP/shade-stop-before.txt"
          git restore --source HEAD handqa/hitl_runner.py
      - name: Reproduce the speech drain on terminal interruption
        run: |
          set -euo pipefail
          git restore --source 354efd8df498f60066c22762bffaf5b987cd2644 handqa/recording.py
          status=0
          uv run --locked --group dev pytest -q tests/test_recording.py -k stops_capture_on_interrupt > "$RUNNER_TEMP/interrupt-before.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/interrupt-before.txt"
          test "$status" -eq 1
          grep -F "'wait for speech' != 'stop capture'" "$RUNNER_TEMP/interrupt-before.txt"
          git restore --source HEAD handqa/recording.py
      - name: Reproduce waiting for narration after terminal Stop
        run: |
          set -euo pipefail
          git restore --source HEAD^ handqa/cli.py handqa/recording.py handqa/speech.py
          status=0
          uv run --locked --group dev pytest -q tests/test_fixes.py -k sigterm_during_final_narration > "$RUNNER_TEMP/final-stop-before.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/final-stop-before.txt"
          test "$status" -eq 1
          grep -F 'AssertionError: capture waited for narration after SIGTERM' "$RUNNER_TEMP/final-stop-before.txt"
          git restore --source HEAD handqa/cli.py handqa/recording.py handqa/speech.py
      - name: Verify the fixed runner
        run: uv run --locked --group dev pytest -q
