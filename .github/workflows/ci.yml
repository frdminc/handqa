name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  handqa-tests:
    name: Python tests (handqa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Run pytest
        run: |
          set -euo pipefail
          uv run --locked --group dev pytest -q

  overlay-build:
    name: Overlay app tests & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: overlay-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"

      - name: Unit tests and assemble debug APK
        run: |
          set -euo pipefail
          gradle -p "$PROJECT" --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK manifest (no INTERNET permission) and checksum
        id: apk
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          sha8=${GITHUB_SHA:0:8}
          apk="hitl-button-bar-$sha8.apk"
          cp "$PROJECT/app/build/outputs/apk/debug/app-debug.apk" "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^(package|uses-permission|application-label)" | tee /tmp/badging.txt
          if grep -q "android.permission.INTERNET" /tmp/badging.txt; then
            echo "APK requests INTERNET" >&2
            exit 1
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hitl-button-bar-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.apk }}.sha256
          if-no-files-found: error
